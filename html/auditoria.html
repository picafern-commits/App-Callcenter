<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AutoParts CallCenter</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#06447f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Bragalis Callcenter">
  <link rel="apple-touch-icon" href="../assets/bragalis-callcenter-icon.png">
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card glass">
      <div class="brand-mark">AP</div>
      <h1>AutoParts CallCenter</h1>
      <p>Gestao profissional de chamadas, clientes, pecas, fornecedores e orcamentos.</p>
      <label>Email</label>
      <input id="loginEmail" type="email" placeholder="admin@empresa.pt" autocomplete="email" />
      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="password" autocomplete="current-password" />
      <label class="checkline"><input id="rememberLogin" type="checkbox" checked /> Memorizar conta</label>
      <button id="loginBtn" class="btn primary full">Entrar</button>
      <small>Login ligado ao Firebase Auth quando disponivel.</small>
    </div>
  </div>

  <div id="appShell" class="app-shell hidden">
    <header class="shell-header">
      <div class="header-brand">
        <div class="brand-mark small">AP</div>
        <div>
          <strong>AutoParts</strong>
          <span>CallCenter</span>
        </div>
      </div>

      <div class="header-copy">
        <h2 id="pageTitle">Auditoria</h2>
        <span id="pageSubtitle">Registos criados e alterados</span>
      </div>

      <div class="top-actions">
        <button id="homeBtn" class="btn ghost">Inicio</button>
        <span id="userBadge" class="user-badge">Admin</span>
        <button id="logoutBtn" class="btn danger-soft">Fechar app</button>
      </div>
    </header>

    <div class="nav-strip-wrap">
      <nav id="navMenu" class="nav-strip"></nav>
    </div>

    <main class="main">
      <section id="pageContent" class="content"></section>
    </main>
  </div>

  <div id="modalRoot" class="modal-root hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <script>window.DEFAULT_PAGE = 'auditoria';</script>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('../sw.js').catch(function(err){
        console.warn('Service Worker não registado:', err);
      });
    });
  }
</script>
  <script src="../js/app.js"></script>
</body>
</html>
