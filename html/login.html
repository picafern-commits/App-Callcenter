<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login · AutoParts CallCenter</title>
  <script>
    (function(){
      try{
        var theme=localStorage.getItem('autoparts_user_theme_v1');
        var res=localStorage.getItem('autoparts_resolution_v1') || 'standard';
        var scheme=localStorage.getItem('autoparts_color_scheme_v1') || 'az';
        if(theme==='dark') document.documentElement.classList.add('theme-dark');
        document.documentElement.classList.add('res-'+res);
        document.documentElement.classList.add('scheme-'+scheme);
      }catch(e){}
    })();
  </script>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="auth-boot login-page-body">
  <div id="loginScreen" class="login-screen">
    <div class="login-card glass">
      <div class="brand-mark">AP</div>
      <h1>AutoParts CallCenter</h1>
      <p>Entra na tua conta para aceder à app.</p>
      <label>Email</label>
      <input id="loginEmail" type="email" placeholder="email@empresa.pt" autocomplete="email" />
      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password" />
      <label class="checkline"><input id="rememberLogin" type="checkbox" /> Memorizar email</label>
      <button id="loginBtn" class="btn primary full">Entrar</button>
      <small>O email só fica preenchido automaticamente depois de marcares Memorizar email.</small>
    </div>
  </div>
  <div id="appShell" class="app-shell hidden"></div>
  <div id="modalRoot" class="modal-root hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <script>window.LOGIN_PAGE = true;</script>
  <script src="../js/app.js"></script>
</body>
</html>
